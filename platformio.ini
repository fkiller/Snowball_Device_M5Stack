[env:m5stack-core-esp32]
platform = espressif32@6.12.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = post:scripts/export_flash_plan.py
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
lib_deps =
  m5stack/M5Unified@0.2.11
  m5stack/M5GFX@0.2.32
  bblanchon/ArduinoJson@6.21.5
; LAN pairing/UI/HTTP share the Arduino loop task; its default 8 KiB is too
; small for the nested native path. Keep measurable headroom for mbedTLS.
build_flags = -DCORE_DEBUG_LEVEL=0 -DARDUINO_LOOP_STACK_SIZE=16384 -fstack-usage
