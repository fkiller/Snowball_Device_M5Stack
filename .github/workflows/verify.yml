name: Verify device plugin and firmware
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: g++ -std=c++17 -Wall -Wextra tests/hangul.cpp -o /tmp/snowball-ime && /tmp/snowball-ime
      - run: g++ -std=c++17 -Wall -Wextra tests/navigation.cpp -o /tmp/snowball-nav && /tmp/snowball-nav
      - run: g++ -std=c++17 -Wall -Wextra tests/connection.cpp -o /tmp/snowball-connection && /tmp/snowball-connection
      - run: python -m pip install platformio==6.2.0 pyserial==3.5
      - run: python tests/install_device_test.py
      - run: python -m platformio run
